<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>배너현황</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1d24">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1d24;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .box { max-width: 320px; }
  h1 { color: #93c5fd; font-size: 18px; margin-bottom: 8px; }
  p { font-size: 13px; color: #9ca3af; line-height: 1.6; }
  a {
    display: inline-block;
    margin-top: 16px;
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="box">
    <h1>배너현황</h1>
    <p id="msg">사내망 접속 중... 잠시만 기다려주세요</p>
    <a id="link" href="http://10.10.11.252/banner/">지금 바로 열기</a>
  </div>

<script>
  // 사내 서버로 자동 이동 시도. 실패하면 위 링크로 수동 접속 안내.
  const target = "http://10.10.11.252/banner/";
  fetch(target, { mode: "no-cors" })
    .then(() => { window.location.href = target; })
    .catch(() => {
      document.getElementById("msg").textContent =
        "사내 와이파이에 연결되어 있어야 접속할 수 있습니다. 연결 확인 후 아래 버튼을 눌러주세요.";
    });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>
</body>
</html>
